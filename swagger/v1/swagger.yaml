  "/api/v1/login":
    post:
      summary: Logs in with username/password and returns a bearer token
      tags:
      - Authorization
      description: Enter your account email as username and your password. Copy the
        returned token into Swagger's Authorize dialog. Use principal_type when the
        same email exists for both a customer and a driver.
      parameters: []
      responses:
        '200':
          description: credentials are valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - user
                        - driver
                        example: user
                      token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 86400
                      principal:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                            example: Simon
                          email:
                            type: string
                            example: simon@example.com
                          phone:
                            type: string
                            nullable: true
                          created_at:
                            type: string
                            format: date-time
                  meta:
                    type: object
                    nullable: true
                    example:
                required:
                - success
                - message
                - data
                - meta
        '401':
          description: missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid username or password
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                required:
                - success
                - message
                - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: object
                  properties:
                    username:
                      type: string
                      example: alice@example.com
                    password:
                      type: string
                      format: password
                      example: password123
                    principal_type:
                      type: string
                      enum:
                      - user
                      - driver
                      nullable: true
                      example: user
                  required:
                  - username
                  - password
              required:
              - login
