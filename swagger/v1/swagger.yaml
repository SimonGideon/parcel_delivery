                            line2:
                              type: string
                              nullable: true
                            city:
                              type: string
                              example: Nairobi
                            county:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                  example: Nairobi
                            nearest_town:
                              type: string
                              nullable: true
                              example: Near Total Petrol Station, Ruiru
                            building_name:
                              type: string
                              nullable: true
                              example: ABC Place
                            floor:
                              type: string
                              nullable: true
                              example: 3rd floor
                            door:
                              type: string
                              nullable: true
                              example: B12
                            instructions:
                              type: string
                              nullable: true
                              example: Call at the gate
                            postal_code:
                              type: string
                              nullable: true
                            country:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                  example: Kenya
                            latitude:
                              type: number
                              example: 1.2945
                            longitude:
                              type: number
                              example: 36.8228
                        delivery_address:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            line1:
                              type: string
                              example: 123 Main St
                            line2:
                              type: string
                              nullable: true
                            city:
                              type: string
                              example: Nairobi
                            county:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                  example: Nairobi
                            nearest_town:
                              type: string
                              nullable: true
                              example: Near Total Petrol Station, Ruiru
                            building_name:
                              type: string
                              nullable: true
                              example: ABC Place
                            floor:
                              type: string
                              nullable: true
                              example: 3rd floor
                            door:
                              type: string
                              nullable: true
                              example: B12
                            instructions:
                              type: string
                              nullable: true
                              example: Call at the gate
                            postal_code:
                              type: string
                              nullable: true
                            country:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                  example: Kenya
                            latitude:
                              type: number
                              example: 1.2945
                            longitude:
                              type: number
                              example: 36.8228
                        user:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                              example: Alice
                        driver:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                              example: Bob
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
                      total_pages:
                        type: integer
                        example: 1
                      total_count:
                        type: integer
                        example: 1
                      filters:
                        type: object
                        properties:
                          allowed_statuses:
                            type: array
                            items:
                              type: string
                            example:
                            - finding_driver
                            - assigned
                            - accepted
                            - picked_up
                            - in_transit
                            - delivered
                            - cancelled
                required:
                - success
                - message
                - data
                - meta
        '401':
          description: driver token is not accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid credentials for this endpoint
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                required:
                - success
                - message
                - errors
