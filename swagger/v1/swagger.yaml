---
openapi: 3.0.1
info:
  title: Parcel Delivery API
  version: v1
paths:
  "/api/v1/delivery_requests/{delivery_request_id}/events":
    get:
      summary: Lists the lifecycle event history for a delivery request
      tags:
      - Delivery Events
      security:
      - basic_auth: []
      parameters:
      - name: delivery_request_id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: event history returned
  "/api/v1/delivery_requests":
    get:
      summary: Lists the authenticated customer's or driver's delivery requests
      tags:
      - Delivery Requests
      security:
      - basic_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: requests returned
    post:
      summary: Creates a delivery request and triggers nearest-driver search
      tags:
      - Delivery Requests
      security:
      - basic_auth: []
      description: |
        Requires **customer** credentials. Register via POST /api/v1/users, then
        Authorize with that email (username) and password. Driver credentials
        will not work on this endpoint.
      parameters: []
      responses:
        '201':
          description: delivery request created
        '401':
          description: missing or invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_request:
                  type: object
                  properties:
                    package_description:
                      type: string
                      example: Books
                    package_weight:
                      type: number
                      example: 2.5
                    pickup_address:
                      type: object
                      properties:
                        line1:
                          type: string
                          example: 123 Main St
                        city:
                          type: string
                          example: Nairobi
                        county_id:
                          type: string
                          format: uuid
                          nullable: true
                        country_id:
                          type: string
                          format: uuid
                          nullable: true
                        nearest_town:
                          type: string
                          example: Near Total Petrol Station, Ruiru
                        building_name:
                          type: string
                          example: ABC Place
                          nullable: true
                        floor:
                          type: string
                          example: 3rd floor
                          nullable: true
                        door:
                          type: string
                          example: B12
                          nullable: true
                        instructions:
                          type: string
                          example: Call at the gate
                          nullable: true
                        latitude:
                          type: number
                          example: 1.2945
                        longitude:
                          type: number
                          example: 36.8228
                      required:
                      - line1
                      - city
                      - latitude
                      - longitude
                    delivery_address:
                      type: object
                      properties:
                        line1:
                          type: string
                          example: 456 Side St
                        city:
                          type: string
                          example: Nairobi
                        county_id:
                          type: string
                          format: uuid
                          nullable: true
                        country_id:
                          type: string
                          format: uuid
                          nullable: true
                        nearest_town:
                          type: string
                          example: Near Garden City Mall
                        building_name:
                          type: string
                          example: ABC Place
                          nullable: true
                        floor:
                          type: string
                          example: 3rd floor
                          nullable: true
                        door:
                          type: string
                          example: B12
                          nullable: true
                        instructions:
                          type: string
                          example: Call at the gate
                          nullable: true
                        latitude:
                          type: number
                          example: 1.3
                        longitude:
                          type: number
                          example: 36.83
                      required:
                      - line1
                      - city
                      - latitude
                      - longitude
                  required:
                  - package_description
                  - package_weight
                  - pickup_address
                  - delivery_address
  "/api/v1/delivery_requests/{id}":
    get:
      summary: Retrieves a delivery request visible to its owner or assigned driver
      tags:
      - Delivery Requests
      security:
      - basic_auth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: delivery request found
        '404':
          description: not visible to this principal
  "/api/v1/delivery_requests/{id}/accept":
    post:
      summary: Driver accepts an assigned delivery request
      tags:
      - Delivery Requests
      security:
      - basic_auth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: request accepted
        '409':
          description: request is not in assigned status
  "/api/v1/delivery_requests/{id}/reject":
    post:
      summary: Driver rejects an assigned delivery request, triggering re-assignment
      tags:
      - Delivery Requests
      security:
      - basic_auth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: request rejected
  "/api/v1/driver_locations":
    post:
      summary: Reports the authenticated driver's current location
      tags:
      - Driver Locations
      security:
      - basic_auth: []
      parameters: []
      responses:
        '201':
          description: location recorded
        '401':
          description: missing or invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_location:
                  type: object
                  properties:
                    latitude:
                      type: number
                      example: 1.2921
                    longitude:
                      type: number
                      example: 36.8219
                  required:
                  - latitude
                  - longitude
  "/api/v1/drivers":
    post:
      summary: Registers a driver account
      tags:
      - Drivers
      parameters: []
      responses:
        '201':
          description: driver created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                driver:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Bob
                    email:
                      type: string
                      example: bob@example.com
                    password:
                      type: string
                      format: password
                      example: password123
                    phone:
                      type: string
                      example: "+15557654"
                  required:
                  - name
                  - email
                  - password
  "/api/v1/health":
    get:
      summary: Checks API and database health
      tags:
      - Health
      responses:
        '200':
          description: service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
                required:
                - status
                - database
                - timestamp
  "/api/v1/counties":
    get:
      summary: Lists counties (reference data for address forms), optionally filtered
        by country
      tags:
      - Reference Data
      parameters:
      - name: country_id
        in: query
        format: uuid
        required: false
        schema:
          type: string
      responses:
        '200':
          description: counties returned
  "/api/v1/countries":
    get:
      summary: Lists countries (reference data for address forms)
      tags:
      - Reference Data
      responses:
        '200':
          description: countries returned
  "/api/v1/users":
    post:
      summary: Registers a customer account
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: user created
        '422':
          description: validation failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Alice
                    email:
                      type: string
                      example: alice@example.com
                    password:
                      type: string
                      format: password
                      example: password123
                    phone:
                      type: string
                      example: "+15551234"
                  required:
                  - name
                  - email
                  - password
servers:
- url: "/"
components:
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
      description: HTTP Basic authentication. In the Authorize dialog, enter your
        account email as the username and your password. Register first via POST /api/v1/users
        (customers) or POST /api/v1/drivers (drivers). Some endpoints accept only
        one principal type — e.g. POST /delivery_requests requires customer credentials,
        not driver. To test with different credentials, click "Logout" in this dialog
        first. Once authorized, Swagger UI hides the username/password fields and
        reuses the saved Authorization header for every "Try it out" call until you
        log out — typing new (even wrong) credentials without logging out first has
        no effect.
