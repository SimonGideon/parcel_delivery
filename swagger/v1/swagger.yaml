  "/api/v1/delivery_requests":
    post:
      summary: Creates a delivery request and triggers nearest-driver search
      tags:
      - Delivery Requests
      security:
      - bearer_auth: []
      description: |
        Requires a **customer** bearer token. Register via POST /api/v1/users,
        log in via POST /api/v1/login, then paste the returned token into
        Swagger Authorize. Driver tokens will not work on this endpoint.
      parameters: []
      responses:
        '201':
          description: delivery request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Delivery request created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - pending
                        - finding_driver
                        - assigned
                        - accepted
                        - picked_up
                        - in_transit
                        - delivered
                        - cancelled
                        example: pending
                      package_description:
                        type: string
                        example: Books
                      package_weight:
                        type: number
                        example: 2.5
                      pickup_address:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          line1:
                            type: string
                            example: 123 Main St
                          line2:
                            type: string
                            nullable: true
                          city:
                            type: string
                            example: Nairobi
                          county:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                                example: Nairobi
                          nearest_town:
                            type: string
                            nullable: true
                            example: Near Total Petrol Station, Ruiru
                          building_name:
                            type: string
                            nullable: true
                            example: ABC Place
                          floor:
                            type: string
                            nullable: true
                            example: 3rd floor
                          door:
                            type: string
                            nullable: true
                            example: B12
                          instructions:
                            type: string
                            nullable: true
                            example: Call at the gate
                          postal_code:
                            type: string
                            nullable: true
                          country:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                                example: Kenya
                          latitude:
                            type: number
                            example: 1.2945
                          longitude:
                            type: number
                            example: 36.8228
                      delivery_address:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          line1:
                            type: string
                            example: 123 Main St
                          line2:
                            type: string
                            nullable: true
                          city:
                            type: string
                            example: Nairobi
                          county:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                                example: Nairobi
                          nearest_town:
                            type: string
                            nullable: true
                            example: Near Total Petrol Station, Ruiru
                          building_name:
                            type: string
                            nullable: true
                            example: ABC Place
                          floor:
                            type: string
                            nullable: true
                            example: 3rd floor
                          door:
                            type: string
                            nullable: true
                            example: B12
                          instructions:
                            type: string
                            nullable: true
                            example: Call at the gate
                          postal_code:
                            type: string
                            nullable: true
                          country:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                                example: Kenya
                          latitude:
                            type: number
                            example: 1.2945
                          longitude:
                            type: number
                            example: 36.8228
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                            example: Alice
                      driver:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                            example: Bob
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                  meta:
                    type: object
                    nullable: true
                    example:
                required:
                - success
                - message
                - data
                - meta
        '422':
          description: validation failed (e.g. a county_id/country_id that does not
            exist)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: county
                        message:
                          type: string
                          example: must exist
                        code:
                          type: string
                          example: required
                required:
                - success
                - message
                - errors
        '401':
          description: missing or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Missing Authorization header — log in and use the returned
                      bearer token in Swagger
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                required:
                - success
                - message
                - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_request:
                  type: object
                  properties:
                    package_description:
                      type: string
                      example: Books
                    package_weight:
                      type: number
                      example: 2.5
                    pickup_address:
                      type: object
                      properties:
