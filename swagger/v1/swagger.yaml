---
openapi: 3.0.1
info:
  title: Parcel Delivery API
  version: v1
paths:
  "/api/v1/delivery_requests/{delivery_request_id}/events":
    get:
      summary: Lists the lifecycle event history for a delivery request
      tags:
      - Delivery Events
      security:
      - bearer_auth: []
      parameters:
      - name: delivery_request_id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      - name: event_type
        in: query
        required: false
        enum:
        - created
        - finding_driver
        - driver_assigned
        - driver_accepted
        - driver_rejected
        - picked_up
        - in_transit
        - delivered
        - cancelled
        description: "Filter to one lifecycle event type:\n * `created` \n * `finding_driver`
          \n * `driver_assigned` \n * `driver_accepted` \n * `driver_rejected` \n
          * `picked_up` \n * `in_transit` \n * `delivered` \n * `cancelled` \n "
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: event history returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Delivery events retrieved successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        event_type:
                          type: string
                          enum:
                          - created
                          - finding_driver
                          - driver_assigned
                          - driver_accepted
                          - driver_rejected
                          - picked_up
                          - in_transit
                          - delivered
                          - cancelled
                          example: created
                        metadata:
                          type: object
                        occurred_at:
                          type: string
                          format: date-time
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
                      total_pages:
                        type: integer
                        example: 1
                      total_count:
                        type: integer
                        example: 1
                required:
                - success
                - message
                - data
                - meta
        '400':
          description: unknown event_type filter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid event_type filter: bogus'
                  errors:
                    type: array
                    items:
                      type: object
                    example: []
                required:
                - success
                - message
                - errors
  "/api/v1/customer/delivery_requests":
    get:
      summary: Lists the authenticated customer's delivery requests
      tags:
      - Delivery Requests
      security:
      - bearer_auth: []
      description: Customer-only list endpoint. Driver tokens are rejected.
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by lifecycle status. Allowed values are role-specific
          and are returned in meta.filters.allowed_statuses. Customer tokens may filter
          all lifecycle statuses; driver tokens may filter only driver-visible statuses.
        schema:
          type: string
      - name: driver_id
        in: query
        format: uuid
        required: false
        description: Filter visible requests by assigned driver id
        schema:
          type: string
      - name: created_from
        in: query
        format: date-time
        required: false
        description: Filter requests created at or after this ISO8601 timestamp
        schema:
          type: string
      - name: created_to
        in: query
        format: date-time
        required: false
        description: Filter requests created at or before this ISO8601 timestamp
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Search package_description plus pickup/delivery city, nearest_town,
          and line1
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        enum:
        - created_at
        - updated_at
        - status
        - package_weight
        description: "Sort field. Defaults to created_at:\n * `created_at` \n * `updated_at`
          \n * `status` \n * `package_weight` \n "
        schema:
          type: string
      - name: sort_direction
        in: query
        required: false
        enum:
        - asc
        - desc
        description: Sort direction. Defaults to desc
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number, starting at 1
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Items per page, 1-100. Defaults to 25
        schema:
          type: integer
      responses:
        '200':
          description: customer requests returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
