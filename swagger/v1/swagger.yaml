---
openapi: 3.0.1
info:
  title: Parcel Delivery API
  version: v1
paths:
  "/api/v1/health":
    get:
      summary: Checks API and database health
      tags:
      - Health
      responses:
        '200':
          description: service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
                required:
                - status
                - database
                - timestamp
servers:
- url: "/"
