tags:
- name: Authorization
  description: Register users and drivers, then log in to get a bearer token for protected
    endpoints.
- name: Delivery Requests
  description: Create, view, list, cancel, accept, and reject parcel delivery requests.
- name: Delivery Events
  description: View delivery request lifecycle history.
- name: Driver Locations
  description: Driver location reporting.
- name: Reference Data
  description: Countries and counties used by address forms.
- name: Health
  description: Service health checks.
servers:
- url: "/"
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: signed_token
      description: 'Log in via POST /api/v1/login with username (email) and password,
        copy the returned token, then paste only the token value here. Swagger UI
        will send it as Authorization: Bearer <token>. Some endpoints accept only
        one principal type — e.g. POST /delivery_requests requires a customer token,
        not a driver token.'
